services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks_tests
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: isolated-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks_tests"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.1-alpine
    environment:
      RABBITMQ_DEFAULT_USER: tasks
      RABBITMQ_DEFAULT_PASS: isolated-test-only
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/rabbitmq/.erlang.cookie && su-exec rabbitmq rabbitmq-diagnostics -q check_running"]
      interval: 3s
      timeout: 5s
      retries: 30

  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      ConnectionStrings__Tasks: Host=postgres;Database=tasks_tests;Username=tasks;Password=isolated-test-only
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: tasks
      RabbitMq__Password: isolated-test-only
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
